services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: apartz
      POSTGRES_USER: apartz
      POSTGRES_PASSWORD: apartz_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: apartz
      MINIO_ROOT_PASSWORD: apartz_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
